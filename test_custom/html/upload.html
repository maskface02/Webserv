<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>File Upload Test</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #eee; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #e94560; }
        form { background: #16213e; padding: 20px; border-radius: 10px; }
        input[type="file"] { margin: 10px 0; padding: 10px; background: #0f3460; color: #eee; border: 1px solid #e94560; border-radius: 5px; }
        button { background: #e94560; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #c73e54; }
        .info { background: #0f3460; padding: 15px; border-radius: 5px; margin: 20px 0; }
        a { color: #e94560; }
    </style>
</head>
<body>
    <div class="container">
        <h1>File Upload Test</h1>
        <form method="POST" enctype="multipart/form-data" action="/upload">
            <p>Select a file to upload:</p>
            <input type="file" name="file" id="file" required>
            <br>
            <button type="submit">Upload File</button>
        </form>
        <div class="info">
            <p><b>Max size:</b> 10MB</p>
            <p><b>Storage:</b> ./test_custom/upload/</p>
            <p><a href="/upload/">View uploaded files</a></p>
        </div>
        <p><a href="/">Back to Dashboard</a></p>
    </div>
</body>
</html>
