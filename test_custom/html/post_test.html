<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>POST Test</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #eee; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #2196F3; }
        form { background: #16213e; padding: 20px; border-radius: 10px; }
        label { display: block; margin: 10px 0 5px; }
        input[type="text"], textarea { width: 100%; padding: 10px; background: #0f3460; color: #eee; border: 1px solid #2196F3; border-radius: 5px; box-sizing: border-box; }
        button { background: #2196F3; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 15px; }
        button:hover { background: #1976D2; }
        a { color: #2196F3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>POST Request Test</h1>
        <form method="POST" action="/post">
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" placeholder="Enter your name">
            <label for="message">Message:</label>
            <textarea name="message" id="message" rows="4" placeholder="Enter your message"></textarea>
            <button type="submit">Send POST Request</button>
        </form>
        <p><a href="/">Back to Dashboard</a></p>
    </div>
</body>
</html>
