<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>403 - Forbidden</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #eee; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; }
        h1 { font-size: 72px; color: #ff6b35; margin: 0; }
        p { font-size: 18px; color: #aaa; }
        a { color: #fff; background: #ff6b35; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 20px; }
        a:hover { background: #e55a2b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>403</h1>
        <p>Forbidden</p>
        <p>You don't have permission to access this resource.</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
