<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>404 - Not Found</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #eee; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; }
        h1 { font-size: 72px; color: #e94560; margin: 0; }
        p { font-size: 18px; color: #aaa; }
        a { color: #0f3460; background: #e94560; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 20px; }
        a:hover { background: #c73e54; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Not Found</p>
        <p>The requested resource was not found on this server.</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
