<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>500 - Internal Server Error</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #eee; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; }
        h1 { font-size: 72px; color: #ef5350; margin: 0; }
        p { font-size: 18px; color: #aaa; }
        a { color: #fff; background: #ef5350; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 20px; }
        a:hover { background: #e53935; }
    </style>
</head>
<body>
    <div class="container">
        <h1>500</h1>
        <p>Internal Server Error</p>
        <p>Something went wrong on the server. Please try again later.</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
