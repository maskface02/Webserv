server {
    listen 127.0.0.1:8080;
    client_max_body_size 10485760;

    error_page 404 ./test_custom/errors/404.html;
    error_page 403 ./test_custom/errors/403.html;
    error_page 405 ./test_custom/errors/405.html;
    error_page 413 ./test_custom/errors/413.html;
    error_page 500 ./test_custom/errors/500.html;

    location / {
        root ./test_custom/html;
        index index.html;
        upload_store ./test_custom/upload;
        allow_methods GET POST DELETE;
        autoindex off;
    }

    location /upload {
        root ./test_custom/html;
        index upload.html;
        allow_methods GET POST;
        upload_store ./test_custom/upload;
        autoindex on;
    }

    location /post {
        root ./test_custom/html;
        index post_test.html;
        allow_methods GET;
    }

    location /cgi {
        root ./test_custom/cgi_bin;
        index echo.py;
        cgi .py /usr/bin/python3;
        allow_methods GET POST;
        autoindex on;
    }

    location /sessions {
        root ./test_custom/cgi_bin/sessions;
        index access.py;
        cgi .py /usr/bin/python3;
        allow_methods GET POST;
    }

    location /php {
        root ./test_custom/cgi_bin/php;
        index info.php;
        cgi .php /usr/bin/php-cgi;
        allow_methods GET POST;
        autoindex on;
    }

    location /files {
        root ./test_custom/static_files;
        allow_methods GET DELETE;
        autoindex on;
    }

    location /redirect {
        return 301 http://localhost:8080/;
    }

    location /small_only {
        root ./test_custom/html;
        allow_methods POST;
        client_max_body_size 100;
        upload_store ./test_custom/upload;
    }

    location /delete {
        root ./test_custom/static_files;
        allow_methods GET DELETE;
        autoindex on;
    }
}
# tester config

server 
{
    listen 127.0.0.1:8081;
    client_max_body_size 1000000000;
    error_page 404 ./test;
    # 1) / must answer to GET request ONLY
    location / {
        allow_methods GET;
        root ./;
        index index.html;
        autoindex on;
    }
    # 2) Any file with .bla as extension must answer to POST request by calling the cgi_test executable
    #    The /directory/ location handles this — any .bla file inside will trigger CGI on POST
    location /directory/ {
        allow_methods GET POST;
        root ./test_custom/YoupiBanane;
        index youpi.bad_extension;
        cgi .bla ./test_custom/cgi_tester;
    }

    # 3) /post_body must answer anything to POST request with a maxBody of 100
    location /post_body {
        allow_methods POST;
        root ./;
        upload_store ./test_custom/upload;
        client_max_body_size 100;
    }
}

