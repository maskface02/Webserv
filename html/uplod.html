<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Standard Image Upload</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; }
        .card { background: white; padding: 25px; border-radius: 8px; width: 350px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input[type="file"] { margin: 15px 0; }
        input[type="submit"] { background: #007bff; color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; }
        input[type="submit"]:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Standard Image Upload</h3>
        
        <!-- Standard form submission -->
        <form action="/" method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required><br>
            <input type="submit" value="Upload Image">
        </form>

    </div>

</body>
</html>
